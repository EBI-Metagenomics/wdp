# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
#
# Same tool/container as modules/local/gemsparcl/cluster/ -- see that module's environment.yml
# for the full rationale (no bioconda package, pip-installed from a pinned GitHub commit).
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::git
  - conda-forge::python
  - conda-forge::pip
  - conda-forge::procps-ng
  - bioconda::sketchlib=0.4.1
  - pip:
      - git+https://github.com/johannahelene/gemsparcl@078c47dbbc1a45f7ab2532666da13f4f2aaab6b8
