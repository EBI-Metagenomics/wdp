repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-wdp_logo_light.png
    - docs/images/nf-core-wdp_logo_light.png
    - docs/images/nf-core-wdp_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/pr-comment.yml
    - .github/workflows/linting.yml
    - .github/.dockstore.yml
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-wdp_logo_light.png
    - docs/images/nf-core-wdp_logo_light.png
    - docs/images/nf-core-wdp_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/.dockstore.yml
    - docs/CONTRIBUTING.md
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  readme:
    - nextflow_badge

template:
  org: EBI-Metagenomics
  name: WDP
  description: A coordinated and scalable Nextflow pipeline for uniform quality control,
    fast clustering and comprehensive annotation of prokaryotic genomes.
  author: Christina Vasilopoulou
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github
    - igenomes
    - fastqc
    - seqera_platform
    - gpu
    - email
  is_nfcore: false
